const words=[
['sustainable','/səˈsteɪnəbl/','adj. 可持续的','Cities should invest in sustainable transport.','城市应该投资可持续的交通方式。','环境'],
['biodiversity','/ˌbaɪəʊdaɪˈvɜːsəti/','n. 生物多样性','Protecting biodiversity is essential for healthy ecosystems.','保护生物多样性对健康的生态系统至关重要。','环境'],
['emission','/ɪˈmɪʃn/','n. 排放；排放物','Carbon emissions can be reduced through better public transport.','更好的公共交通能够减少碳排放。','环境'],
['renewable','/rɪˈnjuːəbl/','adj. 可再生的','Wind is a renewable source of energy.','风是一种可再生能源。','环境'],
['curriculum','/kəˈrɪkjələm/','n. 课程体系','The school has introduced a more practical curriculum.','这所学校引入了更加实用的课程体系。','教育'],
['literacy','/ˈlɪtərəsi/','n. 读写能力','Digital literacy is becoming increasingly important.','数字素养变得越来越重要。','教育'],
['compulsory','/kəmˈpʌlsəri/','adj. 强制的；义务的','Education is compulsory for children in many countries.','许多国家对儿童实行义务教育。','教育'],
['assessment','/əˈsesmənt/','n. 评估','Continuous assessment can help teachers track progress.','持续评估可以帮助教师跟踪进度。','教育'],
['innovation','/ˌɪnəˈveɪʃn/','n. 创新','Technological innovation can improve medical care.','技术创新能够改善医疗服务。','科技'],
['accessible','/əkˈsesəbl/','adj. 可使用的；易获取的','Online courses make education more accessible.','在线课程使教育更容易获得。','科技'],
['automation','/ˌɔːtəˈmeɪʃn/','n. 自动化','Automation is changing the nature of work.','自动化正在改变工作的性质。','科技'],
['privacy','/ˈprɪvəsi/','n. 隐私','Users are increasingly concerned about online privacy.','用户越来越关注网络隐私。','科技'],
['infrastructure','/ˈɪnfrəstrʌktʃə/','n. 基础设施','Reliable infrastructure supports economic growth.','可靠的基础设施支持经济增长。','城市'],
['congestion','/kənˈdʒestʃən/','n. 拥堵','Cycling can help reduce traffic congestion.','骑自行车有助于缓解交通拥堵。','城市'],

const grammar=[
{q:'If governments invested more in public transport, traffic ___ reduced.',a:['will be','would be','is','has been'],correct:1,why:'对现在或将来不太可能情况的假设：If + 一般过去时，主句用 would + 动词原形。这里还需要被动语态 would be reduced。',tag:'虚拟语气'},
{q:'The number of students studying abroad ___ increased.',a:['have','are','has','were'],correct:2,why:'The number of … 表示“……的数量”，主语核心是 number，作单数处理，因此用 has increased。A number of students 才搭配复数谓语。',tag:'主谓一致'},
{q:'This is the city ___ I grew up.',a:['which','where','who','what'],correct:1,why:'从句 I grew up 缺少地点状语，用 where（相当于 in which）。如果从句缺少主语或宾语，才考虑 which。',tag:'定语从句'},

{q:'There is ___ evidence to support this claim.',a:['many','a few','several','little'],correct:3,why:'Evidence 是不可数名词。little 表示“几乎没有”，可修饰 evidence；many、a few、several 用来修饰可数复数名词。',tag:'可数与不可数'},

function writingPage(){const task=writing[taskIndex];shell('写作工作坊','先写下来，再一点点打磨。草稿输入后自动保存。',`<div class="chip-row">${writing.map((t,i)=>`<button class="chip ${taskIndex===i?'selected':''}" data-task="${i}">${t.label}</button>`).join('')}</div><section class="practice-card"><div class="practice-top"><span class="pill">${task.title}</span><small>建议 ${task.minutes} 分钟 · 至少 ${task.min} 词</small></div><p lang="en">${task.prompt}</p>${task.id==='task1'?'<table style="width:100%;border-collapse:collapse;margin-top:18px;text-align:left" aria-label="通勤方式占比"><caption>示例练习数据 · 单位：%</caption><thead><tr><th>Transport</th><th>2010</th><th>2020</th></tr></thead><tbody><tr><td>Car</td><td>60</td><td>45</td></tr><tr><td>Bus</td><td>30</td><td>35</td></tr><tr><td>Bicycle</td><td>10</td><td>20</td></tr></tbody></table>':''}<div class="row" style="margin-top:18px"><span id="timer" style="font-size:23px;font-variant-numeric:tabular-nums">${formatTime(timerKind==='writing'?timerRemaining:task.minutes*60)}</span><button class="secondary" data-action="write-timer">${timer?'暂停计时':'开始 / 继续计时'}</button><button class="text-btn" data-action="reset-write-timer">重置</button></div><label for="essay">你的作文</label><textarea id="essay" lang="en" placeholder="Start with one sentence. You've got this…">${escapeHTML(state.drafts[task.id]||'')}</textarea><div class="row"><small><span id="word-count">${wordCount(state.drafts[task.id]||'')}</span> / ${task.min} words</small><small id="draft-status" style="text-align:right">${storageOk?'本机草稿':'浏览器存储不可用'}</small></div><details><summary>看看写作结构</summary><p style="white-space:pre-line">${task.outline}</p></details><details><summary>参考表达 · 非完整范文</summary><p lang="en" style="white-space:pre-line">${task.sample}</p></details><div class="row"><button class="secondary" data-action="export-essay">导出作文</button><button class="primary" data-action="check-essay">完成并自查</button></div><div id="essay-feedback" role="status"></div><p class="help">提供词数、段落与结构自查，不判断语法、论证质量或雅思分数。需要 AI 批改时再接入服务。</p></section>`);}
function progressPage(){const learned=Object.values(state.vocab).filter(v=>v.level>0).length,correct=Object.values(state.grammar).filter(v=>v.correct).length;main.innerHTML=`<div class="practice"><div class="page-title"><div class="eyebrow">SMALL STEPS, REAL PROGRESS</div><h1>每一步，都算数</h1><p>这里没有别人的进度，只有你的成长。</p></div><div class="stat-grid"><div class="panel"><strong>${state.xp}</strong><small>累计 XP</small></div><div class="panel"><strong>${Object.keys(state.days).length}</strong><small>练习天数</small></div><div class="panel"><strong>${streak()}</strong><small>连续天数</small></div></div><section class="panel"><h2>我的技能足迹</h2><div class="list-item"><span>单词 · 最近选择已记住</span><strong>${learned} / ${words.length}</strong></div><div class="list-item"><span>语法 · 最近答对的题目</span><strong>${correct} / ${grammar.length}</strong></div><div class="list-item"><span>口语 · 累计完成次数</span><strong>${Object.values(state.completed).flat().filter(id=>id.startsWith('speaking:')).length}</strong></div><div class="list-item"><span>写作 · 本机草稿</span><strong>${Object.values(state.drafts).filter(s=>s.trim()).length}</strong></div></section><section class="panel" style="margin-top:18px"><h2>小岛徽章</h2><div style="margin-top:12px">${[['🌱 初次出发',state.xp>0],['📚 词汇探索家',learned>=10],['🔥 三日同行',streak()>=3],['✨ 百分成长',state.xp>=100]].map(([label,on])=>`<span class="badge" style="opacity:${on?1:.4}">${label}${on?' ✓':' · 待解锁'}</span>`).join('')}</div></section></div>`;}
function profilePage(){shell('我的小岛','简单一点，专注学习本身。',`<section class="panel"><div class="pet-row"><span class="pet-emoji">🦊</span><div><h2>小岛学习家</h2><p class="muted">目标 ${state.target} 分 · 每天 ${state.minutes} 分钟</p></div></div><div class="divider"></div><button class="secondary full" data-action="settings">调整学习计划</button><button class="secondary full" style="margin-top:12px" data-action="export-progress">导出进度备份</button><label for="import-progress">从备份恢复</label><input type="file" id="import-progress" accept="application/json,.json"><p class="help">恢复会覆盖当前浏览器的学习记录，操作前会再次确认。备份可能包含作文正文，请自行妥善保管。</p></section><section class="panel" style="margin-top:18px"><h3>关于这个小岛</h3><p class="help">这是一个可用的轻量练习版，包含 20 个单词、8 道语法题、6 个口语话题、2 道写作题与 1 组听辨练习，并非完整雅思课程。所有题目均为自编练习，不是官方真题。</p><p class="help">无登录、无广告、无付费 AI 接口。数据不上传，清理浏览器数据可能导致记录丢失；建议定期导出。不同设备和浏览器之间不会自动同步。</p><p class="help">${storageOk?'当前浏览器支持本地保存。':'当前浏览器无法持久保存，请及时导出。'} 语音朗读取决于设备是否安装英语语音；录音需要安全连接及麦克风权限。</p></section>`);}
function listeningPage(){shell('听辨小挑战','听一句，找出关键词。使用设备语音合成，不是真人考试音频。',`<section class="practice-card"><span class="pill">环境话题 · 听辨练习</span><h2 style="margin:20px 0">句子中提到的能源是什么？</h2><button class="primary full" data-action="listen">${icon('sound')} 播放 / 再听一次</button><div class="options">${['Coal','Wind','Oil'].map((s,i)=>`<button class="option" data-listen-answer="${i}">${s}</button>`).join('')}</div><div id="listen-feedback" role="status"></div><details><summary>查看原文</summary><p lang="en">Wind is a renewable source of energy.</p></details></section>`);}
function speak(text){if(!('speechSynthesis'in window)){toast('设备不支持朗读，请使用例句阅读练习。');return;}speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='en-GB';utterance.rate=.85;utterance.onerror=()=>toast('语音未能播放，请检查系统英语语音或网络设置。');speechSynthesis.speak(utterance);}
function clearRecording(){recordToken++;micPending=false;if(recorder&&recorder.state!=='inactive'){recorder.onstop=null;recorder.stop();}if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;recorder=null;if(recordUrl)URL.revokeObjectURL(recordUrl);recordUrl=null;}
async function toggleRecording(){if(recorder&&recorder.state==='recording'){recorder.stop();return;}if(micPending)return;if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('此环境无法录音：请用 HTTPS 打开，或使用手机录音机。');return;}micPending=true;const token=++recordToken;document.querySelector('#record-status').textContent='等待麦克风授权…';try{const acquired=await navigator.mediaDevices.getUserMedia({audio:true});if(token!==recordToken||page!=='speaking'){acquired.getTracks().forEach(t=>t.stop());return;}stream=acquired;recorder=new MediaRecorder(stream);const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onerror=()=>{clearRecording();if(page==='speaking')speakingPage();toast('录音中断，请重新尝试或用手机录音机。');};recorder.onstop=()=>{stream?.getTracks().forEach(t=>t.stop());stream=null;if(page!=='speaking')return;if(recordUrl)URL.revokeObjectURL(recordUrl);const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});recordUrl=URL.createObjectURL(blob);const ext=blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm';document.querySelector('#record-output').innerHTML=`<audio controls src="${recordUrl}"></audio><a href="${recordUrl}" download="ielts-speaking-${dayKey()}.${ext}">下载这次录音</a>`;document.querySelector('#record-status').textContent=`已录制 ${Math.max(1,Math.round((Date.now()-recordingStarted)/1000))} 秒 · 回听一下吧`;document.querySelector('.record').classList.remove('recording');document.querySelector('.record').setAttribute('aria-label','开始新录音');};recorder.start();recordingStarted=Date.now();document.querySelector('.record').classList.add('recording');document.querySelector('.record').setAttribute('aria-label','停止录音');document.querySelector('#record-status').textContent='正在录音 · 再点一次停止';}catch{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(page==='speaking')document.querySelector('#record-status').textContent='未获得麦克风权限，可以继续计时练习';toast('麦克风未能启用，请检查浏览器权限。');}finally{micPending=false;}}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function navigate(next){if(page==='writing')saveDraft();stopTimer();timerRemaining=0;timerKind='';clearRecording();if('speechSynthesis'in window)speechSynthesis.cancel();page=next;render();window.scrollTo(0,0);}
function render(){updateChrome();if(page==='home')home();else if(page==='learn'){main.innerHTML=`<div class="page-title"><div class="eyebrow">EXPLORE YOUR LEARNING ISLAND</div><h1>挑一项，轻松开始</h1><p>今天的你，想解锁哪一种技能？</p></div>${courses()}<div class="section-head"><h2>加餐小挑战</h2></div><button class="course full" data-go="listening"><div class="row"><span>${icon('sound')} 听辨小挑战</span><small>设备朗读 · 听词辨义 →</small></div></button>`;}else if(page==='vocab')vocab();else if(page==='grammar')grammarPage();else if(page==='speaking')speakingPage();else if(page==='writing')writingPage();else if(page==='progress')progressPage();else if(page==='profile')profilePage();else if(page==='listening')listeningPage();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.go){navigate(b.dataset.go);return;}if(b.dataset.topic){topic=b.dataset.topic;wordIndex=0;revealed=false;spellMode=false;vocab();return;}if(b.dataset.rate){rateWord(b.dataset.rate==='know');return;}if(b.dataset.option!==undefined){if(selected!==null)return;selected=Number(b.dataset.option);const correct=selected===grammar[grammarIndex].correct;state.grammar[grammarIndex]={correct};if(correct)award('grammar:'+grammarIndex,15);persist();grammarPage();return;}if(b.dataset.part){clearRecording();stopTimer();timerKind='';timerRemaining=0;part=Number(b.dataset.part);speakingIndex=0;speakingPage();return;}if(b.dataset.task!==undefined){saveDraft();stopTimer();timerRemaining=0;timerKind='';taskIndex=Number(b.dataset.task);writingPage();return;}if(b.dataset.listenAnswer!==undefined){const correct=b.dataset.listenAnswer==='1';document.querySelector('#listen-feedback').innerHTML=`<div class="answer ${correct?'':'error'}">${correct?'听对了！Wind = 风，renewable = 可再生的。':'再听一次，注意句子开头的能源名称。'}</div>`;if(correct)award('listening:wind',10);return;}const action=b.dataset.action;
if(action==='settings'){document.querySelector('#target').value=state.target;document.querySelector('#minutes').value=state.minutes;document.querySelector('#settings').showModal();}
if(action==='close-settings')document.querySelector('#settings').close();
if(action==='reveal'){revealed=true;vocab();}
if(action==='review'){review=!review;wordIndex=0;revealed=false;spellMode=false;vocab();}
if(action==='all-words'){review=false;topic='全部';vocab();}
if(action==='pronounce')speak(wordList()[wordIndex].word);
if(action==='spell'){spellMode=true;vocab();document.querySelector('#spelling').focus();}
if(action==='check-spelling'){const w=wordList()[wordIndex],input=document.querySelector('#spelling').value.trim().toLowerCase();if(!input){toast('先试着输入单词吧。');return;}if(input===w.word)rateWord(true);else{document.querySelector('#spell-feedback').innerHTML=`<div class="answer error">再试一下：正确拼写是 <strong>${w.word}</strong>。看一眼后，尝试重新输入。</div>`;state.vocab[w.word]={level:0,due:Date.now()+600000};persist();}}
if(action==='next-grammar'){grammarIndex=(grammarIndex+1)%grammar.length;selected=null;grammarPage();}
if(action==='next-speaking'){clearRecording();stopTimer();timerKind='';timerRemaining=0;speakingIndex=(speakingIndex+1)%speaking[part].length;speakingPage();}
if(action==='record')toggleRecording();
if(action==='speak-timer')runTimer('speaking',part===2?120:60);
if(action==='reset-speak-timer'){stopTimer();timerKind='speaking';timerRemaining=part===2?120:60;document.querySelector('#timer').textContent=formatTime(timerRemaining);renderTimerButton();}
if(action==='complete-speaking'){const added=award(`speaking:${part}:${speakingIndex}`,20);toast(added?'练习完成，+20 XP！记得回听并自评。':'今天这个话题已经奖励过啦，继续练习也很棒。');}
if(action==='write-timer')runTimer('writing',writing[taskIndex].minutes*60);
if(action==='reset-write-timer'){stopTimer();timerKind='writing';timerRemaining=writing[taskIndex].minutes*60;document.querySelector('#timer').textContent=formatTime(timerRemaining);renderTimerButton();}
if(action==='export-essay'){saveDraft();download(`雅思作文-${writing[taskIndex].id}-${dayKey()}.txt`,state.drafts[writing[taskIndex].id]||'','text/plain;charset=utf-8');}
if(action==='check-essay'){saveDraft();const text=document.querySelector('#essay').value.trim(),count=wordCount(text),task=writing[taskIndex];if(!count){toast('先写一点内容，再开始自查。');return;}const paragraphs=text.split(/\n\s*\n/).filter(Boolean).length;const enough=count>=task.min;document.querySelector('#essay-feedback').innerHTML=`<div class="answer ${enough?'':'error'}"><strong>${enough?'字数目标达成！':'还差 '+(task.min-count)+' 个词，加油！'}</strong><p>${count} 词 · ${paragraphs} 个以空行分隔的段落</p><p>自查：是否回应题目？${task.id==='task1'?'是否写出总体趋势并准确比较数据？':'立场是否明确？主体段有解释和例子吗？'} 检查时态、拼写与句间衔接。</p><small>这是规则自查，不是 AI 批改或官方评分。</small></div>`;if(enough)award('writing:'+task.id,30);}
if(action==='listen')speak('Wind is a renewable source of energy.');
if(action==='export-progress')download(`雅思小岛备份-${dayKey()}.json`,JSON.stringify(state,null,2),'application/json');
});
document.addEventListener('input',e=>{if(e.target.id==='essay')saveDraft();});
document.addEventListener('keydown',e=>{if(e.target.id==='spelling'&&e.key==='Enter'){e.preventDefault();document.querySelector('[data-action="check-spelling"]').click();}});
document.querySelector('#settings-form').addEventListener('submit',e=>{e.preventDefault();state.target=document.querySelector('#target').value;state.minutes=Number(document.querySelector('#minutes').value);persist();document.querySelector('#settings').close();if(page==='home'||page==='profile')render();toast('计划更新啦，按自己的节奏来。');});
function validBackup(s){if(!s||s.version!==1||!Number.isInteger(s.xp)||s.xp<0||s.xp>10000000||!['5.5','6.0','6.5','7.0','7.5','8.0','8.5','9.0'].includes(s.target)||![10,20,30,45].includes(s.minutes))return false;for(const key of ['days','vocab','grammar','drafts','completed'])if(!s[key]||typeof s[key]!=='object'||Array.isArray(s[key])||Object.keys(s[key]).some(k=>['__proto__','constructor','prototype'].includes(k)))return false;return Object.entries(s.days).every(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&Number.isInteger(v)&&v>0)&&Object.entries(s.vocab).every(([k,v])=>words.some(w=>w.word===k)&&v&&Number.isInteger(v.level)&&v.level>=0&&v.level<=4&&Number.isFinite(v.due))&&Object.values(s.grammar).every(v=>v&&typeof v.correct==='boolean')&&Object.entries(s.drafts).every(([k,v])=>['task1','task2'].includes(k)&&typeof v==='string'&&v.length<500000)&&Object.entries(s.completed).every(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&Array.isArray(v)&&v.every(id=>typeof id==='string'&&/^(vocab|grammar|speaking|writing|listening):[a-z0-9:]+$/.test(id)));}
document.addEventListener('change',async e=>{if(e.target.id!=='import-progress')return;const file=e.target.files[0];if(!file)return;try{if(file.size>2000000)throw Error();const imported=JSON.parse(await file.text());if(!validBackup(imported))throw Error();if(!confirm('恢复备份会覆盖本机现有进度及作文。确认继续？')){e.target.value='';return;}state=imported;persist();navigate('profile');toast('进度已恢复，欢迎回到小岛。');}catch{toast('备份格式无效或文件过大，未修改现有记录。');e.target.value='';}});
window.addEventListener('pagehide',()=>{if(page==='writing')saveDraft();clearRecording();});
document.querySelector('#brand-icon').innerHTML=icon('leaf');document.querySelector('#settings-icon').innerHTML=icon('user');render();
</script>
</body>
</html>
